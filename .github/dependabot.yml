version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Version updates stay off (a limit of 0); this file exists to group
    # security updates. Docusaurus packages must share one version, and
    # @docusaurus/theme-search-algolia is pinned exactly (see
    # src/theme/SearchBar/index.js), so they have to bump in a single PR.
    open-pull-requests-limit: 0
    groups:
      docusaurus:
        applies-to: security-updates
        patterns:
          - "@docusaurus/*"
